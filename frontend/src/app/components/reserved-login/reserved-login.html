<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <form (ngSubmit)="login()" class="card p-4 shadow-sm mt-5">

        <h4 class="text-center mb-4">Login</h4>

        <div class="mb-3">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            class="form-control"
            required
          />
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success">
            Login
          </button>
        </div>

        @if (error) {
          <div class="alert alert-danger mt-3 mb-0 text-center">
            {{ error }}
          </div>
        }

      </form>
    </div>
  </div>
</div>
